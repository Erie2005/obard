<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stock Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <i class="fas fa-store"></i>
      </div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to manage your stock</p>

      <div id="alert-container"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePassword('password')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <p class="field-error" id="password-error"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <p style="text-align:center; margin-top:24px; color:var(--gray-500); font-size:0.9rem;">
        Don't have an account? <a href="/register">Create Account</a>
      </p>

      <div style="margin-top:20px; padding:14px; background:var(--info-light); border-radius:var(--radius); font-size:0.8rem; color:var(--info);">
        <strong><i class="fas fa-info-circle"></i> Demo Credentials:</strong><br>
        Email: admin@shop.com<br>
        Password: Admin@123
      </div>
    </div>
  </div>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = input.nextElementSibling.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      container.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type === 'danger' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}</div>`;
      setTimeout(() => container.innerHTML = '', 5000);
    }

    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      const input = document.getElementById(id.replace('-error', ''));
      el.textContent = msg;
      el.classList.add('show');
      if (input) input.classList.add('error');
    }

    function clearErrors() {
      document.querySelectorAll('.field-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
      document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;
      if (!email) { showFieldError('email-error', 'Email is required'); valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showFieldError('email-error', 'Enter a valid email'); valid = false; }
      if (!password) { showFieldError('password-error', 'Password is required'); valid = false; }
      if (!valid) return;

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/dashboard', 800);
        } else {
          showAlert(data.error || data.errors?.[0]?.msg || 'Login failed', 'danger');
        }
      } catch (err) {
        showAlert('Network error. Please try again.', 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });
  </script>
</body>
</html>
