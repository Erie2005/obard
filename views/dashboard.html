<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Stock Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <button class="mobile-toggle" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </button>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-store"></i> StockPro</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/products"><i class="fas fa-boxes-stacked"></i> Products</a>
        <a href="/stock"><i class="fas fa-exchange-alt"></i> Stock Records</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar"></div>
          <div>
            <div class="user-name" id="user-name"></div>
            <div class="user-email" id="user-email"></div>
          </div>
        </div>
        <button class="btn btn-outline btn-sm btn-block" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Dashboard</h1>
          <p class="breadcrumb">Overview of your stock management</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fas fa-boxes-stacked"></i></div>
          <div class="stat-details">
            <h4>Total Products</h4>
            <div class="stat-value" id="stat-products">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="fas fa-coins"></i></div>
          <div class="stat-details">
            <h4>Stock Value</h4>
            <div class="stat-value" id="stat-value">$0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow"><i class="fas fa-arrow-down"></i></div>
          <div class="stat-details">
            <h4>Total Stock In</h4>
            <div class="stat-value" id="stat-in">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><i class="fas fa-arrow-up"></i></div>
          <div class="stat-details">
            <h4>Total Stock Out</h4>
            <div class="stat-value" id="stat-out">0</div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <!-- Low Stock Alerts -->
        <div class="card">
          <div class="card-header">
            <h3><i class="fas fa-exclamation-triangle" style="color:var(--warning);margin-right:8px;"></i> Low Stock Alerts</h3>
          </div>
          <div class="card-body" id="low-stock-container">
            <div class="empty-state">
              <i class="fas fa-check-circle" style="color:var(--success)"></i>
              <h3>All products are well stocked</h3>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="card">
          <div class="card-header">
            <h3><i class="fas fa-clock" style="color:var(--primary);margin-right:8px;"></i> Recent Activity</h3>
          </div>
          <div class="card-body" id="activity-container">
            <div class="empty-state">
              <i class="fas fa-inbox"></i>
              <h3>No recent activity</h3>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    function setUserInfo() {
      fetch('/api/stock/dashboard').then(r => r.json()).then(() => {});
      const name = document.cookie.split(';').find(c => c.trim().startsWith('name='));
    }

    function formatCurrency(val) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' min ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/stock/dashboard');
        if (res.status === 401) { window.location.href = '/login'; return; }
        const data = await res.json();

        document.getElementById('stat-products').textContent = data.totalProducts;
        document.getElementById('stat-value').textContent = formatCurrency(data.totalStockValue);
        document.getElementById('stat-in').textContent = data.totalStockIn.toLocaleString();
        document.getElementById('stat-out').textContent = data.totalStockOut.toLocaleString();

        // Low stock
        const lowStockEl = document.getElementById('low-stock-container');
        if (data.lowStockProducts.length > 0) {
          lowStockEl.innerHTML = '<ul class="low-stock-list">' +
            data.lowStockProducts.map(p => `
              <li class="low-stock-item">
                <div>
                  <strong>${escapeHtml(p.name)}</strong>
                  <span style="color:var(--gray-400);font-size:0.85rem;margin-left:8px;">${escapeHtml(p.category || '')}</span>
                </div>
                <span class="badge ${p.quantity_in_stock === 0 ? 'badge-danger' : 'badge-warning'}">
                  ${p.quantity_in_stock} left
                </span>
              </li>
            `).join('') + '</ul>';
        }

        // Recent activity
        const activityEl = document.getElementById('activity-container');
        if (data.recentActivity.length > 0) {
          activityEl.innerHTML = '<ul class="activity-list">' +
            data.recentActivity.map(a => `
              <li class="activity-item">
                <div class="activity-icon ${a.type.toLowerCase()}">${a.type === 'IN' ? '<i class="fas fa-arrow-down"></i>' : '<i class="fas fa-arrow-up"></i>'}</div>
                <div class="activity-details">
                  <div class="activity-text">
                    <span class="badge ${a.type === 'IN' ? 'badge-success' : 'badge-danger'}">${a.type === 'IN' ? 'Stock In' : 'Stock Out'}</span>
                    ${a.quantity} x ${escapeHtml(a.product_name)}
                  </div>
                  <div class="activity-time">${formatDate(a.recorded_at)}</div>
                </div>
              </li>
            `).join('') + '</ul>';
        }
      } catch (err) {
        console.error('Failed to load dashboard:', err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Load user info from a quick API call
    async function loadUserInfo() {
      try {
        const res = await fetch('/api/products');
        if (res.status === 401) { window.location.href = '/login'; return; }
      } catch (e) {}
      // We'll set default user info since we don't expose user API separately
      document.getElementById('user-avatar').textContent = 'S';
      document.getElementById('user-name').textContent = 'Shopkeeper';
      document.getElementById('user-email').textContent = '';
    }

    loadDashboard();
    loadUserInfo();
  </script>
</body>
</html>
