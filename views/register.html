<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Stock Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <i class="fas fa-store"></i>
      </div>
      <h1>Create Account</h1>
      <p class="subtitle">Register to start managing your stock</p>

      <div id="alert-container"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="full_name">Full Name <span class="required">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Enter your full name" required>
          <p class="field-error" id="full_name-error"></p>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+250780000000">
          <p class="field-error" id="phone-error"></p>
          <p class="input-hint">Optional. Format: +250XXXXXXXXX</p>
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('password')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <p class="field-error" id="password-error"></p>
          <p class="input-hint">Min 8 chars: uppercase, lowercase, number, special character</p>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('confirm_password')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <p class="field-error" id="confirm_password-error"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <p style="text-align:center; margin-top:24px; color:var(--gray-500); font-size:0.9rem;">
        Already have an account? <a href="/login">Sign In</a>
      </p>
    </div>
  </div>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = input.nextElementSibling.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      container.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type === 'danger' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}</div>`;
      setTimeout(() => container.innerHTML = '', 5000);
    }

    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      const input = document.getElementById(id.replace('-error', ''));
      el.textContent = msg;
      el.classList.add('show');
      if (input) input.classList.add('error');
    }

    function clearErrors() {
      document.querySelectorAll('.field-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
      document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;

      let valid = true;
      if (!full_name || full_name.length < 2) { showFieldError('full_name-error', 'Full name must be at least 2 characters'); valid = false; }
      if (!email) { showFieldError('email-error', 'Email is required'); valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showFieldError('email-error', 'Enter a valid email'); valid = false; }
      if (phone && !/^\+?[0-9]{7,15}$/.test(phone)) { showFieldError('phone-error', 'Invalid phone number format'); valid = false; }
      if (!password) { showFieldError('password-error', 'Password is required'); valid = false; }
      else if (password.length < 8) { showFieldError('password-error', 'Password must be at least 8 characters'); valid = false; }
      else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])/.test(password)) {
        showFieldError('password-error', 'Must include uppercase, lowercase, number, and special character');
        valid = false;
      }
      if (password !== confirm_password) { showFieldError('confirm_password-error', 'Passwords do not match'); valid = false; }
      if (!valid) return;

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, phone, password, confirm_password }),
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Account created! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/dashboard', 800);
        } else {
          showAlert(data.error || data.errors?.[0]?.msg || 'Registration failed', 'danger');
        }
      } catch (err) {
        showAlert('Network error. Please try again.', 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    });
  </script>
</body>
</html>
